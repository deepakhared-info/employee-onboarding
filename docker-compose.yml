services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    # env_file:
    #   - .env
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:postgres@db:5432/app
    volumes:
      - ./main.py:/app/main.py
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
